<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BillBell</title>
<meta name="theme-color" content="#1B2B5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BillBell">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#1B2B5E; --navy-2:#2B3D75; --navy-3:#15224B; --gold:#CDB074; --gold-2:#E2CC93; --red:#E5302B; --bill:#E5302B;
  --bg:#F2F4F9; --card:#FFFFFF; --ink:#14213D; --muted:#6B7591; --line:#E3E7F0;
  --ok:#2E9D62; --soft:var(--soft); --soft2:var(--soft2); --soft3:var(--soft3); --input:var(--input); --hist:var(--hist); --linkc:#1B2B5E; --warn:#D9822B; --danger:#D64545; --shadow:0 1px 2px rgba(20,33,61,.06),0 6px 18px rgba(20,33,61,.06);
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1430; --card:#18213F; --ink:#E8ECF7; --muted:#98A2BF; --line:#2A3558; --soft:#232D4F; --soft2:#1E2846; --soft3:#232D4F; --input:#121933; --hist:#33406A; --linkc:#C9D3F2; color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0E1430; --card:#18213F; --ink:#E8ECF7; --muted:#98A2BF; --line:#2A3558; --soft:#232D4F; --soft2:#1E2846; --soft3:#232D4F; --input:#121933; --hist:#33406A; --linkc:#C9D3F2; color-scheme:dark;}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit}
.wrap{max-width:560px;margin:0 auto}

/* Header */
header{background:var(--navy);color:#fff;padding:calc(var(--safe-top) + 8px) 16px 0;position:sticky;top:0;z-index:20;border-bottom:4px solid var(--gold)}
.top{display:flex;align-items:center;gap:8px}
.logo{font-size:24px;font-weight:900;letter-spacing:-.5px;flex:1;display:flex;align-items:center;gap:8px}
.logo .b1{color:var(--bill)} .logo .b2{color:var(--gold)}
.demo-chip{font-size:11px;font-weight:800;background:var(--gold);color:var(--navy);padding:3px 8px;border-radius:99px;letter-spacing:.3px}
.ibtn{width:38px;height:38px;border-radius:12px;background:var(--navy-2);display:grid;place-items:center}
.ibtn svg{width:20px;height:20px;stroke:#fff}
.ibtn:active{transform:scale(.95)}
.ibtn.spin svg{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:1fr 1.45fr 1fr;gap:6px;margin:8px 0}
.stat{background:var(--navy-2);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:5px;min-width:0}
.stat b{font-size:17px;font-weight:900;line-height:1.2;white-space:nowrap}
.stat.money b{color:var(--gold)}
.stat span{font-size:11.5px;color:#C9D0E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--navy-3);border-radius:12px;padding:3px;margin-bottom:10px}
.tab{padding:6px 4px;border-radius:9px;font-weight:800;font-size:14.5px;color:#C9D0E6;display:flex;justify-content:center;align-items:center;gap:6px}
.tab.on{background:#FFFFFF;color:var(--navy)}
.tab .n{font-size:11.5px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--navy-2);color:#fff;display:inline-grid;place-items:center}
.tab.on .n{background:var(--navy);}
.tab .n.alert{background:var(--danger);color:#fff}

main{padding:16px 16px calc(110px + var(--safe-bot))}
.sec{font-size:12.5px;font-weight:900;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;margin:18px 4px 10px}
.sec:first-child{margin-top:4px}
.banner{border:2px dashed var(--gold);border-radius:16px;padding:14px;background:var(--card);margin-bottom:14px}
.banner p{margin:0 0 10px;font-size:14.5px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:800;font-size:15px}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:var(--soft);color:var(--linkc)}
.btn.red{background:#FCECEC;color:var(--danger)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}

/* Alerts */
.alert-card{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);border-left:5px solid var(--warn);margin-bottom:8px}
.alert-card.danger{border-left-color:var(--danger)}
.alert-card .t{font-weight:800;font-size:15px}
.alert-card .s{font-size:13px;color:var(--muted)}

/* Tiles */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:20px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;box-shadow:var(--shadow);position:relative}
.tile:active{transform:scale(.97)}
.av{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:21px;letter-spacing:-.5px;position:relative;overflow:hidden;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#FFFFFF;padding:8px}
.av.sm img{padding:5px}
.tile .cat{position:absolute;left:10px;bottom:9px;width:18px;height:18px;color:var(--muted);opacity:.75}
.tile .cat svg{width:100%;height:100%}
.dot{position:absolute;top:10px;right:10px;width:13px;height:13px;border-radius:99px;box-shadow:0 0 0 3px var(--card)}
.dot.urgent{background:#E03B3B}.dot.due{background:#F08A24}.dot.auto{background:#2F80ED}.dot.paid{background:#2E9D62}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin:14px 0 0;font-size:12.5px;color:var(--muted);font-weight:800}
.legend span{display:flex;align-items:center;gap:6px}
.legend .dot{position:static;box-shadow:none;width:10px;height:10px;display:inline-block}
.rdot{width:9px;height:9px;border-radius:99px;background:var(--danger);display:inline-block}
.av.sm{width:40px;height:40px;border-radius:12px;font-size:14px}
.badge{position:absolute;top:8px;right:10px;min-width:22px;height:22px;border-radius:99px;background:var(--danger);color:#fff;font-size:12.5px;font-weight:900;display:grid;place-items:center;padding:0 6px;border:2px solid var(--card)}
.tile .nm{font-weight:900;font-size:14px;line-height:1.15;min-height:32px;display:flex;align-items:center;justify-content:center;padding:0 2px}
.tile .amt{font-weight:900;font-size:15px;margin-top:2px}
.tile .when{font-size:12.5px;color:var(--muted);margin-top:1px}
.when.soon{color:var(--warn)} .when.late{color:var(--danger)} .when.auto{color:var(--ok)}
.tile .flag{position:absolute;top:8px;left:10px;font-size:11px}

/* Lists */
.list{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted)}
.row .r{text-align:right;font-weight:900}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--soft);color:var(--linkc);margin-left:4px;vertical-align:middle}
.chip.ok{background:#E6F5EC;color:var(--ok)} .chip.warn{background:#FDF1E4;color:var(--warn)} .chip.danger{background:#FCECEC;color:var(--danger)}
.month-total{display:flex;justify-content:space-between;margin:18px 4px 8px;font-size:12.5px;font-weight:900;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}
.empty .big{font-size:40px;margin-bottom:6px}

/* Review */
.rcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.rcard .head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.why{background:#FDF6E7;color:#7A5A12;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fields .full{grid-column:1/-1}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:800}
label.f input,label.f select{display:block;width:100%;margin-top:3px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--input);color:var(--ink);font-weight:700;font-size:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1}

/* Bottom navigation */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--navy);border-top:4px solid var(--gold);display:grid;grid-template-columns:repeat(3,1fr);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + var(--safe-bot)) max(16px,env(safe-area-inset-left,0px))}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;color:#C9D0E6;font-size:12px;font-weight:800;letter-spacing:.2px}
.nav-item svg{width:24px;height:24px;stroke:currentColor}
.nav-item.on{color:var(--gold)}
.nav-item:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:12px}
.nav-item.add{margin-top:-24px}
.nav-item .plus{width:56px;height:56px;border-radius:18px;background:var(--gold);display:grid;place-items:center;box-shadow:0 6px 18px rgba(10,18,40,.35);border:4px solid var(--navy)}
.nav-item .plus svg{width:26px;height:26px;stroke:var(--navy)}
.nav-item.add:active .plus{transform:scale(.94)}

/* Pull to refresh */
.ptr{position:fixed;left:50%;top:calc(var(--safe-top) + 8px);transform:translate(-50%,-70px);z-index:55;display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:8px 14px 8px 10px;border-radius:99px;font-size:13.5px;font-weight:800;box-shadow:0 6px 18px rgba(10,18,40,.3);border:2px solid var(--gold);pointer-events:none;opacity:0}
.ptr svg{width:18px;height:18px;stroke:var(--gold)}
.ptr.busy{transform:translate(-50%,0);opacity:1;transition:transform .2s,opacity .2s}
.ptr.busy svg{animation:spin 1s linear infinite}
@media (prefers-reduced-motion: reduce){.ptr.busy svg{animation:none}}

/* Sheets & panels */
.scrim{position:fixed;inset:0;background:rgba(10,18,40,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;z-index:41;transform:translateY(105%);transition:transform .25s ease;padding:8px 16px calc(24px + var(--safe-bot));max-width:560px;margin:0 auto}
.sheet.on{transform:none;visibility:visible}
.grab{width:40px;height:5px;border-radius:9px;background:var(--hist);margin:4px auto 10px}
.sh-head{display:flex;align-items:center;gap:12px;margin:0 -16px 12px;padding:6px 16px 10px;position:sticky;top:-8px;z-index:2;background:var(--bg)}
.sh-head h2{margin:0;font-size:20px;font-weight:900;flex:1}
.x{width:36px;height:36px;border-radius:99px;background:var(--soft3);display:grid;place-items:center}
.x svg{width:16px;height:16px;stroke:var(--ink)}
.panel{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;transform:translateX(100%);transition:transform .25s ease}
.panel.on{transform:none}
.panel header{border-bottom-width:4px}
.bill{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.bill .amtbig{font-size:30px;font-weight:900;letter-spacing:-.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:800}
.bpay{background:var(--soft2);border-radius:12px;padding:10px 12px;margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;font-size:14px}
.bpay .lbl{font-size:12px;color:var(--muted)}
.copy{padding:6px 10px;border-radius:9px;background:var(--card);font-size:13px;font-weight:800;color:var(--linkc);border:1.5px solid var(--line)}
.hist{display:flex;align-items:flex-end;gap:6px;height:70px;margin:8px 0 2px}
.hist div{flex:1;background:var(--hist);border-radius:6px 6px 2px 2px;position:relative}
.hist div.cur{background:var(--gold)}
.hist-l{display:flex;gap:6px;font-size:10.5px;color:var(--muted)} .hist-l span{flex:1;text-align:center}

/* Charts */
.seg{display:flex;background:var(--soft3);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--linkc);box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 2px;font-size:16px;font-weight:900}
.card .sub{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.bigtotal{font-size:28px;font-weight:900}
.bar-row{margin:10px 0}
.bar-row .l{display:flex;justify-content:space-between;font-size:14px;font-weight:800}
.bar-row .l span:last-child{font-variant-numeric:tabular-nums}
.bar-row .track{height:9px;background:var(--soft);border-radius:9px;margin-top:5px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:9px}
.bar-row .meta{font-size:12px;color:var(--muted);margin-top:3px}
.chart-box{position:relative;height:230px}
select.period{width:100%;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:16px;color:var(--ink);margin-bottom:12px}

/* PIN */
.pin{position:fixed;inset:0;background:var(--navy);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:20px}
.pin.on{display:flex}
.dots{display:flex;gap:14px} .dots i{width:14px;height:14px;border-radius:99px;border:2px solid var(--gold)} .dots i.f{background:var(--gold)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keys button{height:72px;border-radius:99px;background:var(--navy-2);color:#fff;font-size:26px;font-weight:800}
.keys button:active{background:var(--gold);color:var(--navy)}
.shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(100px + var(--safe-bot));transform:translate(-50%,20px);background:#15224B;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:70;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--muted)} .small{font-size:13px}
/* Theme picker */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.theme{border-radius:14px;overflow:hidden;border:2px solid var(--line);text-align:left;background:var(--card)}
.theme.on{border-color:var(--ink)}
.theme .sw{height:44px;display:flex;align-items:flex-end;padding:6px 8px;gap:4px;font-weight:900;font-size:14px}
.theme .sw i{width:14px;height:14px;border-radius:5px;display:inline-block}
.theme .nm{display:block;padding:6px 8px;font-size:12px;font-weight:800;color:var(--ink)}
/* Next up */
.nextup{width:100%;display:flex;align-items:center;gap:7px;background:var(--card);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:14px;margin-bottom:10px;text-align:left;min-width:0}
.nextup .dot{position:static;box-shadow:none;width:9px;height:9px;flex:none}
.nextup .lbl{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted);flex:none}
.nextup b{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nextup .amt{font-weight:900;margin-left:auto;font-variant-numeric:tabular-nums;flex:none}
.nextup .w{font-size:12.5px;color:var(--muted);flex:none}
.nextup .w.late{color:var(--danger)} .nextup .w.soon{color:var(--warn)} .nextup .w.auto{color:#2F80ED}
.nextup svg{width:14px;height:14px;stroke:var(--muted);flex:none}

/* Calendar */
.cal{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px 10px 10px;margin-bottom:12px}
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cal-h .t{font-size:11.5px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);flex:1}
.cal-h button{font-size:12.5px;font-weight:800;color:var(--linkc);padding:4px 8px;border-radius:8px;background:var(--soft)}
.cal-h .nav{width:28px;padding:4px 0}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:2px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 5px;border-radius:9px;min-width:0}
.day .wd{font-size:9.5px;color:var(--muted);font-weight:800}
.day .dn{font-size:13px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.day .ds{display:flex;gap:2px;height:6px}
.day .ds i{width:6px;height:6px;border-radius:99px;display:block}
.day.today{background:var(--gold);color:var(--navy)} .day.today .wd{color:var(--navy)}
.day.has{cursor:pointer} .day.has:active{background:var(--soft)}
.day.blank{visibility:hidden}
.day.past .dn{color:var(--muted)}
.mhead{font-size:9.5px;color:var(--muted);font-weight:800;text-align:center;padding-bottom:2px}
.i-urgent{background:#E03B3B}.i-due{background:#F08A24}.i-auto{background:#2F80ED}.i-paid{background:#2E9D62}

/* Spending ring */
.ring{color:#fff;align-items:center;gap:6px;text-align:left}
.ring svg{width:22px;height:22px;flex:none;transform:rotate(-90deg)}
.ring .rt{display:flex;flex-direction:column;min-width:0;line-height:1.1}
.ring .rt b{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring .rt span{font-size:10.5px;color:#C9D0E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring .rt .up{color:#FF9B8A} .ring .rt .down{color:#8FE3B0}

/* Swipe to mark paid */
.swipe{position:relative;margin-bottom:12px;border-radius:16px;overflow:hidden}
.swipe .bill{margin:0;position:relative;touch-action:pan-y;transition:transform .2s ease}
.swipe .bill.dragging{transition:none}
.swipe-bg{position:absolute;inset:0;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:22px;font-weight:900;font-size:15px;border-radius:16px}
.swipe-bg svg{width:22px;height:22px}
.swipe-hint{font-size:12px;color:var(--muted);text-align:center;margin:-4px 0 12px}

/* Toast with undo + tick */
.toast{display:flex;align-items:center;gap:10px}
.toast.on{pointer-events:auto}
.toast span{white-space:nowrap}
.toast button{color:var(--gold);font-weight:900;padding:2px 4px}
.toast .tick{width:20px;height:20px;flex:none}
.toast .tick path{stroke:#8FE3B0;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s .1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* Motion */
.tile{animation:rise .32s ease both;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.tile .dot.urgent{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 3px var(--card),0 0 0 3px rgba(224,59,59,.55)}70%{box-shadow:0 0 0 3px var(--card),0 0 0 11px rgba(224,59,59,0)}100%{box-shadow:0 0 0 3px var(--card),0 0 0 11px rgba(224,59,59,0)}}
@media (prefers-reduced-motion: reduce){.tile,.tile .dot.urgent,.toast .tick path{animation:none}.toast .tick path{stroke-dashoffset:0}.swipe .bill{transition:none}}

hr.s{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<div class="wrap">
<header id="hdr">
  <div class="top">
    <div class="logo"><span><span class="b1">Bill</span><span class="b2">Bell</span></span><span id="demoChip" class="demo-chip" hidden>DEMO</span></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="stUnpaid">0</b><span>unpaid</span></div>
    <div class="stat money"><b id="stTotal">$0.00</b><span>to pay</span></div>
    <button class="stat ring" id="ring" data-nav="stats" aria-label="Spending this month"></button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="due">Bills</button>
    <button class="tab" data-tab="paid">Paid</button>
    <button class="tab" data-tab="review">Review <span class="rdot" id="nReview" hidden></span></button>
  </div>
</header>
<main id="main"></main>
</div>

<div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><span id="ptrText">Pull to refresh</span></div>

<nav class="bnav" aria-label="Main">
  <button class="nav-item" data-nav="stats" id="navStats"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span>Stats</span></button>
  <button class="nav-item add" data-nav="add"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span>Add</span></button>
  <button class="nav-item" data-nav="settings" id="navSettings"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
</nav>

<!-- Charts panel -->
<section class="panel" id="charts">
  <header>
    <div class="top" style="padding-bottom:14px">
      <button class="ibtn" id="chartsBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="logo" style="font-size:22px;color:#fff">Spending</div>
      <button class="ibtn" id="btnCsv" aria-label="Export CSV"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
    </div>
  </header>
  <div class="wrap" style="padding:16px 16px calc(110px + var(--safe-bot))" id="chartsBody"></div>
</section>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></section>

<div class="pin" id="pin">
  <div style="font-size:30px;font-weight:900"><span style="color:var(--bill)">Bill</span><span style="color:var(--gold)">Bell</span></div>
  <div class="muted" style="color:#C9D0E6" id="pinMsg">Enter your PIN</div>
  <div class="dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
  <button class="btn gold" id="bioBtn" hidden>Unlock with Face ID</button>
  <div class="keys" id="pinKeys"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n || 0).toLocaleString('en-AU', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const money0 = n => '$' + Math.round(Number(n || 0)).toLocaleString('en-AU');
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoOf(new Date());
const dOf = s => new Date(s + 'T00:00:00');
const daysTo = s => Math.round((dOf(s) - dOf(today())) / 864e5);
const addDays = (s, n) => { const d = dOf(s); d.setDate(d.getDate() + n); return isoOf(d); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const nice = s => { if (!s) return '—'; const d = dOf(s); return DOW[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const niceY = s => { if (!s) return '—'; const d = dOf(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const monthKey = s => s ? s.slice(0, 7) : '';
const monthLabel = k => { const [y, m] = k.split('-'); return MON[+m - 1] + ' ' + y; };
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
             del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
function toast(msg, opts = {}) {
  const t = $('#toast');
  t.innerHTML = (opts.tick ? '<svg class="tick" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>' : '') + `<span>${esc(msg)}</span>` + (opts.undo ? '<button type="button">Undo</button>' : '');
  if (opts.undo) t.querySelector('button').onclick = () => { t.classList.remove('on'); opts.undo(); };
  t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), opts.undo ? 4500 : 2400);
}
function markPaid(id) {
  run(() => update(id, {status: 'paid', paidDate: today()}));
  toast('Marked as paid', {tick: 1, undo: () => run(() => update(id, {status: 'due', paidDate: ''}), 'Moved back to Bills')});
}
function copy(text, what) { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast((what || 'Copied') + ' copied'), () => toast(text)); }

const ICON = {
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>'
};

/* ================= State ================= */
const S = { bills: [], providers: [], settings: {}, tab: 'due', demo: true, api: '', key: '', loading: false };

function readConfigFromHash() {
  if (!location.hash.includes('api=')) return;
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('api') && p.get('key')) { ls.set('bb_api', p.get('api')); ls.set('bb_key', p.get('key')); }
  history.replaceState(null, '', location.pathname + location.search);
  setTimeout(() => toast('BillBell connected'), 400);
}

function normalise(data) {
  S.providers = (data.providers || []).map(p => ({...p, cycle: Number(p.cycle) || 0}));
  S.bills = (data.bills || []).map(b => ({...b, amount: Number(b.amount) || 0, autopay: String(b.autopay) === 'true'}));
  S.settings = data.settings || {};
}

/* Talks to the scanner. Uses a script tag (JSONP) because iPhone Safari can block normal requests to Google. */
let jsonpN = 0;
function jsonp(params, timeoutMs = 60000) {
  return new Promise((resolve, reject) => {
    const cb = '__bb' + Date.now().toString(36) + (jsonpN++);
    const q = new URLSearchParams({...params, key: S.key, callback: cb, t: Date.now()});
    const el = document.createElement('script');
    const done = () => { clearTimeout(timer); delete window[cb]; el.remove(); };
    const timer = setTimeout(() => { done(); reject(new Error('The scanner took too long to answer. Try again in a minute.')); }, timeoutMs);
    window[cb] = data => { done(); data && data.error ? reject(new Error(data.error)) : resolve(data); };
    el.onerror = () => { done(); reject(new Error('Google returned an error page. In Apps Script, check Who has access is Anyone, then deploy a New version.')); };
    el.src = S.api + (S.api.includes('?') ? '&' : '?') + q.toString();
    document.head.appendChild(el);
  });
}
async function api(action, payload) {
  if (S.demo) return demoAction(action, payload);
  let data;
  if (action === 'upload') {
    await fetch(S.api, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({key: S.key, action, ...payload}) });
    data = await jsonp({action: 'data'});
  } else data = await jsonp({action, payload: JSON.stringify(payload || {})}, action === 'scan' ? 300000 : 60000);
  normalise(data); ls.set('bb_cache', JSON.stringify(data)); render();
}

async function load(showSpin) {
  S.api = ls.get('bb_api') || ''; S.key = ls.get('bb_key') || '';
  S.demo = !(S.api && S.key); S.lastError = '';
  $('#demoChip').hidden = !S.demo;
  if (S.demo) { normalise(makeDemo()); render(); return; }
  const cached = ls.get('bb_cache');
  if (cached && !S.bills.length) { try { normalise(JSON.parse(cached)); } catch (e) {} }
  render();
  if (showSpin) ptrBusy(true);
  try {
    const data = await jsonp({action: 'data'});
    normalise(data); ls.set('bb_cache', JSON.stringify(data)); render();
  } catch (e) {
    const msg = e.message;
    S.lastError = msg;
    toast(navigator.onLine === false ? 'Offline — showing your saved bills'
      : /\/dev(\?|$)/.test(S.api) ? 'Your setup link uses the test address. Run sendSetupLink again and open the new link.'
      : /missing key/i.test(msg) ? 'The app key doesn\'t match. Open the newest setup link.' : msg);
  }
  finally { ptrBusy(false); }
}

/* ================= Derived data ================= */
const prov = id => S.providers.find(p => p.id === id) || {id, name: id === 'unknown' ? 'Unknown' : id, category: 'Other', colour: '#8A94AD', short: '?'};
const initials = p => p.short || p.name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const logoUrl = p => p.logo || (p.domain ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(p.domain)}&sz=128` : '');
const avatar = (p, sm) => { const u = logoUrl(p);
  return `<div class="av${sm ? ' sm' : ''}" style="background:${esc(p.colour || '#8A94AD')}"><span>${esc(initials(p))}</span>${u ? `<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onload="if(this.naturalWidth<48&&!this.dataset.custom)this.remove()" onerror="this.remove()"${p.logo ? ' data-custom="1"' : ''}>` : ''}</div>`; };
const CAT_ICON = {
  'Electricity': '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  'Gas': '<path d="M12 22a7 7 0 0 0 7-7c0-4-3-6.5-4.5-10-1 2.2-2 3.2-3.2 3.4C11.3 6 10.6 4 9.5 2.5 7 6 5 9 5 15a7 7 0 0 0 7 7z"/><path d="M12 22a3 3 0 0 0 3-3c0-2-1.5-3-3-5-1.5 2-3 3-3 5a3 3 0 0 0 3 3z"/>',
  'Internet': '<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/>',
  'Telecommunications': '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/>',
  'Council Rates': '<path d="M3 21h18M5 21V10l7-5 7 5v11M10 21v-5h4v5"/>',
  'Water': '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>'
};
const catIcon = c => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${CAT_ICON[c] || '<circle cx="12" cy="12" r="8"/>'}</svg>`;
const unpaid = () => S.bills.filter(b => b.status === 'due');
const paid = () => S.bills.filter(b => b.status === 'paid');
const review = () => S.bills.filter(b => b.status === 'review');
const spendBills = () => S.bills.filter(b => (b.status === 'due' || b.status === 'paid') && b.amount > 0);
const billMonth = b => monthKey(b.dueDate || b.issueDate || b.paidDate);

function whenText(b) {
  if (!b.dueDate) return {t: 'no due date', c: ''};
  const d = daysTo(b.dueDate);
  if (b.autopay && d >= 0) return {t: d === 0 ? 'auto-debit today' : `auto-debit in ${d} day${d > 1 ? 's' : ''}`, c: 'auto'};
  if (d < 0) return {t: `${-d} day${d < -1 ? 's' : ''} overdue`, c: 'late'};
  if (d === 0) return {t: 'due today', c: 'late'};
  if (d === 1) return {t: 'tomorrow', c: 'soon'};
  return {t: `in ${d} days`, c: d <= 2 ? 'soon' : ''};
}

function missingBills() {
  const out = [];
  S.providers.forEach(p => {
    if (String(p.active) === 'false' || !(p.cycle > 0)) return;
    const dates = S.bills.filter(b => b.provider === p.id && b.status !== 'ignored').map(b => b.issueDate || b.dueDate).filter(Boolean).sort();
    if (!dates.length) return;
    const gaps = []; for (let i = 1; i < dates.length; i++) { const g = (dOf(dates[i]) - dOf(dates[i - 1])) / 864e5; if (g > 5) gaps.push(g); }
    let every = p.cycle; if (gaps.length >= 2) { gaps.sort((a, b) => a - b); every = Math.round(gaps[Math.floor(gaps.length / 2)]); }
    const last = dates[dates.length - 1];
    const late = -daysTo(last) - every;
    if (late > 5) out.push({p, late, last, every});
  });
  return out;
}

/* ================= Render ================= */
function render() {
  const u = unpaid();
  $('#stUnpaid').textContent = u.length;
  $('#stTotal').textContent = money(u.reduce((s, b) => s + b.amount, 0));
  $('#nReview').hidden = !review().length;
  renderRing();
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === S.tab));
  $('#main').innerHTML = S.tab === 'due' ? renderDue() : S.tab === 'paid' ? renderPaid() : renderReview();
}

function billState(b) {
  if (b.status === 'paid') return 'paid';
  if (b.autopay) return 'auto';
  if (b.dueDate && daysTo(b.dueDate) <= 3) return 'urgent';
  return 'due';
}
const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

function nextUpHtml() {
  const b = unpaid().filter(x => x.dueDate).sort((a, c) => a.dueDate < c.dueDate ? -1 : 1)[0];
  if (!b) return '';
  const p = prov(b.provider), w = whenText(b);
  return `<button class="nextup" data-prov="${esc(p.id)}"><span class="dot ${billState(b)}"></span><span class="lbl">Next</span><b>${esc(p.name)}</b><span class="amt">${money(b.amount)}</span><span class="w ${w.c}">${w.t}</span></button>`;
}

const CAL = { month: null };   // null = two-week strip, else 'YYYY-MM'
function dayDots(iso) {
  const bills = S.bills.filter(b => (b.status === 'due' || b.status === 'paid') && b.dueDate === iso);
  return { bills, html: bills.slice(0, 3).map(b => `<i class="i-${billState(b)}"></i>`).join('') };
}
function dayCell(iso, opts = {}) {
  const d = dOf(iso), dd = dayDots(iso), t = today();
  const cls = ['day', iso === t ? 'today' : '', iso < t ? 'past' : '', dd.bills.length ? 'has' : ''].join(' ');
  return `<div class="${cls}" ${dd.bills.length ? `data-day="${iso}" role="button" tabindex="0" aria-label="${niceY(iso)}: ${dd.bills.length} bill${dd.bills.length > 1 ? 's' : ''}"` : ''}>${opts.wd ? `<span class="wd">${DOW[d.getDay()][0]}</span>` : ''}<span class="dn">${d.getDate()}</span><span class="ds">${dd.html}</span></div>`;
}
function calendarHtml() {
  if (!CAL.month) {
    let cells = ''; for (let i = 0; i < 14; i++) cells += dayCell(addDays(today(), i), {wd: 1});
    return `<div class="cal"><div class="cal-h"><span class="t">Next 2 weeks</span><button data-cal="month">Month</button></div><div class="strip">${cells}</div></div>`;
  }
  const [y, m] = CAL.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1), lead = (first.getDay() + 6) % 7, days = new Date(y, m, 0).getDate();
  let cells = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => `<span class="mhead">${x}</span>`).join('');
  for (let i = 0; i < lead; i++) cells += '<div class="day blank"></div>';
  for (let d = 1; d <= days; d++) cells += dayCell(`${y}-${pad(m)}-${pad(d)}`);
  return `<div class="cal"><div class="cal-h"><button class="nav" data-cal="prev" aria-label="Previous month">‹</button><span class="t" style="text-align:center">${MON[m - 1]} ${y}</span><button class="nav" data-cal="next" aria-label="Next month">›</button><button data-cal="strip">2 weeks</button></div><div class="mgrid">${cells}</div></div>`;
}
function openDay(iso) {
  const bills = dayDots(iso).bills;
  openSheet(sheetHead(nice(iso)) + bills.map(b => { const p = prov(b.provider);
    return `<div class="list" style="margin-bottom:10px"><button class="row" style="width:100%;text-align:left" data-prov="${esc(p.id)}">${avatar(p, 1)}<div class="mid"><div class="t">${esc(p.name)}</div><div class="s">${b.status === 'paid' ? 'Paid ' + nice(b.paidDate) : whenText(b).t}</div></div><div class="r">${money(b.amount)}</div></button></div>`; }).join(''));
}

function renderRing() {
  const k = monthKey(today()), [y, m] = k.split('-').map(Number);
  const prevK = m === 1 ? (y - 1) + '-12' : y + '-' + pad(m - 1);
  const sum = key => spendBills().filter(b => billMonth(b) === key).reduce((s, b) => s + b.amount, 0);
  const cur = sum(k), prev = sum(prevK);
  const frac = prev ? Math.min(cur / prev, 1) : (cur ? 1 : 0);
  const C = 2 * Math.PI * 15;
  const pct = prev ? Math.round((cur - prev) / prev * 100) : 0;
  const trend = prev ? `<span class="${pct > 0 ? 'up' : 'down'}">${MON[m - 1]} ${pct > 0 ? '▲' : '▼'}${Math.abs(pct)}%</span>` : `<span>${MON[m - 1]} so far</span>`;
  $('#ring').innerHTML = `<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--navy-2)" stroke-width="5"/>${frac > 0 ? `<circle cx="18" cy="18" r="15" fill="none" stroke="${pct > 0 ? '#FF9B8A' : 'var(--gold)'}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(frac * C).toFixed(1)} ${C.toFixed(1)}"/>` : ''}</svg><span class="rt"><b>${money0(cur)}</b>${trend}</span>`;
  $('#ring').setAttribute('aria-label', `Spent ${money(cur)} in ${MON[m - 1]}${prev ? `, ${Math.abs(pct)}% ${pct > 0 ? 'more' : 'less'} than ${MON[+prevK.slice(5) - 1]}` : ''}`);
}

function renderDue() {
  let h = '';
  if (S.demo) h += `<div class="banner"><p><b>Preview with sample bills.</b> Connect your Gmail scanner to see your real bills.</p><button class="btn gold" data-act="settings">Open settings</button></div>`;
  const miss = missingBills();
  const u = unpaid();
  if (miss.length) {
    h += `<div class="sec">Hasn't arrived</div>`;
    miss.forEach(m => { h += `<div class="alert-card">${avatar(m.p, 1)}<div><div class="t">${esc(m.p.name)} is ${m.late} days late</div><div class="s">Usually every ~${m.every} days · last one ${nice(m.last)}</div></div></div>`; });
  }
  h += nextUpHtml() + calendarHtml();
  const latest = {};
  S.bills.filter(b => b.status === 'due' || b.status === 'paid').forEach(b => {
    const k = b.dueDate || b.paidDate || '';
    if (!latest[b.provider] || k > latest[b.provider]) latest[b.provider] = k;
  });
  const ids = Object.keys(latest);
  if (!ids.length) return h + `<div class="empty"><div class="big">🔔</div>Your bills will appear here as they arrive.</div>`;
  const stateOf = id => {
    const open = u.filter(b => b.provider === id);
    const manual = open.filter(b => !b.autopay);
    if (manual.some(b => b.dueDate && daysTo(b.dueDate) <= 3)) return 'urgent';
    if (manual.length) return 'due';
    if (open.length) return 'auto';
    return 'paid';
  };
  const rank = {urgent: 0, due: 1, auto: 2, paid: 3};
  const nextDue = id => (u.filter(b => b.provider === id).map(b => b.dueDate).sort()[0]) || '9999';
  const tiles = ids.map(id => ({p: prov(id), st: stateOf(id)}))
    .sort((a, b) => rank[a.st] - rank[b.st] || (nextDue(a.p.id) < nextDue(b.p.id) ? -1 : 1) || a.p.name.localeCompare(b.p.name));
  const label = {urgent: 'due within 3 days or overdue', due: 'to pay', auto: 'auto-debit coming', paid: 'paid'};
  h += `<div class="grid" style="margin-top:4px">` + tiles.map((t, i) =>
    `<button class="tile" style="--i:${i}" data-prov="${esc(t.p.id)}" aria-label="${esc(t.p.name)}, ${label[t.st]}"><span class="dot ${t.st}"></span>${avatar(t.p)}<span class="cat" title="${esc(t.p.category)}">${catIcon(t.p.category)}</span></button>`).join('') + `</div>`;
  h += `<div class="legend"><span><i class="dot urgent"></i>Due soon</span><span><i class="dot due"></i>To pay</span><span><i class="dot auto"></i>Auto-debit</span><span><i class="dot paid"></i>Paid</span></div>`;
  return h;
}

function renderPaid() {
  const list = paid().sort((a, b) => (b.paidDate || b.dueDate || '') > (a.paidDate || a.dueDate || '') ? 1 : -1);
  if (!list.length) return `<div class="empty"><div class="big">🧾</div>Paid bills will show here.</div>`;
  const byMonth = {};
  list.forEach(b => { const k = monthKey(b.paidDate || b.dueDate) || 'Unknown'; (byMonth[k] = byMonth[k] || []).push(b); });
  return Object.keys(byMonth).slice(0, 18).map(k => {
    const items = byMonth[k], tot = items.reduce((s, b) => s + b.amount, 0);
    return `<div class="month-total"><span>${k === 'Unknown' ? k : monthLabel(k)}</span><span>${money(tot)}</span></div><div class="list">` +
      items.map(b => { const p = prov(b.provider);
        return `<button class="row" style="width:100%;text-align:left" data-bill="${esc(b.id)}">${avatar(p, 1)}<div class="mid"><div class="t">${esc(p.name)}${b.autopay ? '<span class="chip ok">auto</span>' : ''}</div><div class="s">Paid ${nice(b.paidDate)}${b.period ? ' · ' + esc(b.period) : ''}</div></div><div class="r">${money(b.amount)}</div></button>`; }).join('') + `</div>`;
  }).join('');
}

function providerOptions(sel) {
  return S.providers.map(p => `<option value="${esc(p.id)}"${p.id === sel ? ' selected' : ''}>${esc(p.name)} — ${esc(p.category)}</option>`).join('') +
    (sel === 'unknown' || !sel ? '<option value="unknown" selected>Choose provider…</option>' : '');
}

function renderReview() {
  const list = review();
  if (!list.length) return `<div class="empty"><div class="big">✅</div>Nothing to check. When BillBell isn't sure about an amount or date, it waits here for you.</div>`;
  return `<p class="small muted" style="margin:0 4px 12px">BillBell wasn't sure about these. Check the details, then confirm.</p>` + list.map(b => { const p = prov(b.provider);
    return `<div class="rcard" data-id="${esc(b.id)}">

function closeSheet() { $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }

function billCard(b) {
  const card = billCardInner(b);
  if (b.status === 'paid') return card;
  return `<div class="swipe" data-swipe="${esc(b.id)}"><div class="swipe-bg">${ICON.check} Mark paid</div>${card}</div>`;
}
function billCardInner(b) {
  const p = prov(b.provider), w = whenText(b);
  const status = b.status === 'paid' ? `<span class="chip ok">Paid ${nice(b.paidDate)}</span>` : `<span class="chip ${w.c === 'late' ? 'danger' : w.c === 'soon' ? 'warn' : w.c === 'auto' ? 'ok' : ''}">${w.t}</span>`;
  let h = `<div class="bill"><div style="display:flex;justify-content:space-between;align-items:center"><div class="amtbig">${money(b.amount)}</div>${status}</div>`;
  if (b.flags) h += `<div class="why" style="margin-top:8px">▲ ${esc(b.flags)} — worth a look.</div>`;
  h += `<dl class="kv"><dt>Due</dt><dd>${niceY(b.dueDate)}</dd>`;
  if (b.period) h += `<dt>Period</dt><dd>${esc(b.period)}</dd>`;
  if (b.issueDate) h += `<dt>Issued</dt><dd>${niceY(b.issueDate)}</dd>`;
  if (b.invoiceNo) h += `<dt>Invoice</dt><dd>${esc(b.invoiceNo)}</dd>`;
  if (b.accountNo) h += `<dt>Account</dt><dd>${esc(b.accountNo)}</dd>`;
  if (b.autopay) h += `<dt>Payment</dt><dd>Automatic debit</dd>`;
  h += `</dl>`;

  h += `<div class="acts">`;
  if (b.fileUrl || b.emailUrl) h += `<a class="btn ghost" href="${esc(b.fileUrl || b.emailUrl)}" target="_blank" rel="noopener">${ICON.file} Bill</a>`;
  if (b.status !== 'paid') {
    if (p.payUrl && !b.autopay) h += `<a class="btn gold" href="${esc(p.payUrl)}" target="_blank" rel="noopener">${ICON.ext} Pay</a>`;
    h += `<button class="btn navy" data-act="paid" data-id="${esc(b.id)}">${ICON.check} Mark paid</button>`;
  } else h += `<button class="btn ghost" data-act="unpaid" data-id="${esc(b.id)}">Mark unpaid</button>`;
  return h + `</div></div>`;
}

function historyBars(pid, curId) {
  const hist = S.bills.filter(b => b.provider === pid && (b.status === 'paid' || b.status === 'due') && b.amount > 0)
    .sort((a, b) => (a.dueDate || '') < (b.dueDate || '') ? -1 : 1).slice(-8);
  if (hist.length < 2) return '';
  const max = Math.max(...hist.map(b => b.amount));
  const avg = hist.reduce((s, b) => s + b.amount, 0) / hist.length;
  return `<div class="card"><h3>Recent bills</h3><div class="sub">Average ${money(avg)} per bill</div>
    <div class="hist">${hist.map(b => `<div class="${b.status === 'due' ? 'cur' : ''}" style="height:${Math.max(8, b.amount / max * 100)}%" title="${money(b.amount)}"></div>`).join('')}</div>
    <div class="hist-l">${hist.map(b => `<span>${b.dueDate ? MON[dOf(b.dueDate).getMonth()] : ''}</span>`).join('')}</div></div>`;
}

function openProvider(pid) {
  const p = prov(pid);
  const list = unpaid().filter(b => b.provider === pid).sort((a, b) => (a.dueDate || '') < (b.dueDate || '') ? -1 : 1);
  const lastPaid = paid().filter(b => b.provider === pid).sort((a, b) => (a.paidDate || '') < (b.paidDate || '') ? 1 : -1)[0];
  let h = sheetHead(esc(p.name) + `<div class="small muted" style="font-weight:700">${esc(p.category)}</div>`, avatar(p, 1));
  h += list.length ? list.map(billCard).join('') + '<p class="swipe-hint">Swipe a bill left to mark it paid</p>' : (lastPaid ? billCard(lastPaid) : '<div class="empty">No bills yet.</div>');
  h += historyBars(pid);
  if (lastPaid && list.length) h += `<p class="small muted" style="margin:4px">Last paid ${money(lastPaid.amount)} on ${niceY(lastPaid.paidDate)}.</p>`;
  openSheet(h);
}

function openBill(id) {
  const b = S.bills.find(x => x.id === id); if (!b) return;
  const p = prov(b.provider);
  openSheet(sheetHead(esc(p.name), avatar(p, 1)) + billCard(b) + historyBars(b.provider));
}

/* ================= Charts ================= */
const CAT_COLOURS = {'Electricity': '#E2A93B', 'Gas': '#2E9D62', 'Internet': '#139C9F', 'Telecommunications': '#5B6BD6', 'Council Rates': '#C0563A', 'Water': '#3A8FD9', 'Other': '#8A94AD'};
const catColour = c => CAT_COLOURS[c] || '#8A94AD';
const C = { mode: '12m', month: monthKey(today()), fy: null, charts: [] };

function fyOf(k) { const [y, m] = k.split('-').map(Number); return m >= 7 ? y : y - 1; }
function lastMonths(n, endKey) { const out = []; let [y, m] = endKey.split('-').map(Number); for (let i = 0; i < n; i++) { out.unshift(y + '-' + pad(m)); m--; if (!m) { m = 12; y--; } } return out; }

function openCharts() { $('#charts').classList.add('on'); $('#navStats').classList.add('on'); renderCharts(); }

function renderCharts() {
  C.charts.forEach(c => c.destroy()); C.charts = [];
  const bills = spendBills();
  const months = [...new Set(bills.map(billMonth).filter(Boolean))].sort().reverse();
  const fys = [...new Set(months.map(fyOf))].sort().reverse();
  if (C.fy === null) C.fy = fys[0] ?? fyOf(monthKey(today()));
  if (!months.includes(C.month) && months.length) C.month = months[0];

  let keys, label;
  if (C.mode === 'month') { keys = [C.month]; label = monthLabel(C.month); }
  else if (C.mode === 'fy') { keys = lastMonths(12, (C.fy + 1) + '-06'); label = `FY ${C.fy}–${String(C.fy + 1).slice(2)} (Jul–Jun)`; }
  else { keys = lastMonths(12, monthKey(today())); label = 'Last 12 months'; }
  const inRange = bills.filter(b => keys.includes(billMonth(b)));
  const total = inRange.reduce((s, b) => s + b.amount, 0);

  const byCat = {}, byProv = {};
  inRange.forEach(b => { byCat[b.category || prov(b.provider).category] = (byCat[b.category || prov(b.provider).category] || 0) + b.amount;
    (byProv[b.provider] = byProv[b.provider] || {sum: 0, n: 0}); byProv[b.provider].sum += b.amount; byProv[b.provider].n++; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const provs = Object.entries(byProv).sort((a, b) => b[1].sum - a[1].sum);
  const nMonths = C.mode === 'month' ? 1 : Math.max(1, new Set(inRange.map(billMonth)).size);

  let h = `<div class="seg">${[['12m', '12 months'], ['month', 'Month'], ['fy', 'Tax year']].map(([k, l]) => `<button data-mode="${k}" class="${C.mode === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  if (C.mode === 'month') h += `<select class="period" id="selMonth">${months.map(k => `<option value="${k}"${k === C.month ? ' selected' : ''}>${monthLabel(k)}</option>`).join('')}</select>`;
  if (C.mode === 'fy') h += `<select class="period" id="selFy">${fys.map(y => `<option value="${y}"${y === C.fy ? ' selected' : ''}>FY ${y}–${String(y + 1).slice(2)}</option>`).join('')}</select>`;

  h += `<div class="card"><div class="sub" style="margin:0">${label}</div><div class="bigtotal">${money(total)}</div>
        <div class="small muted">${inRange.length} bills${C.mode !== 'month' ? ` · about ${money(total / nMonths)} a month` : ''}</div></div>`;
  if (C.mode !== 'month') h += `<div class="card"><h3>Each month by category</h3><div class="sub">Tap a bar to see that month</div><div class="chart-box"><canvas id="cMonthly"></canvas></div></div>`;
  h += `<div class="card"><h3>By category</h3><div class="sub">Where the money goes</div>` +
    (cats.length ? `<div class="chart-box" style="height:190px"><canvas id="cCat"></canvas></div>` : '') +
    (cats.map(([c, v]) => `<div class="bar-row"><div class="l"><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${catColour(c)};margin-right:6px"></span>${esc(c)}</span><span>${money(v)}</span></div><div class="track"><div class="fill" style="width:${total ? v / total * 100 : 0}%;background:${catColour(c)}"></div></div><div class="meta">${total ? Math.round(v / total * 100) : 0}% of spending${C.mode !== 'month' ? ' · ' + money(v / nMonths) + '/month' : ''}</div></div>`).join('') || '<p class="muted small">No bills in this period.</p>') + `</div>`;
  h += `<div class="card"><h3>By provider</h3><div class="sub">Total, number of bills and average bill</div>` +
    (provs.map(([id, v]) => { const p = prov(id); return `<div class="bar-row"><div class="l"><span>${esc(p.name)}</span><span>${money(v.sum)}</span></div><div class="track"><div class="fill" style="width:${total ? v.sum / total * 100 : 0}%;background:${esc(p.colour)}"></div></div><div class="meta">${v.n} bill${v.n > 1 ? 's' : ''} · average ${money(v.sum / v.n)}</div></div>`; }).join('') || '<p class="muted small">No bills in this period.</p>') + `</div>`;
  if (C.mode !== 'month') h += `<div class="card"><h3>Trend by provider</h3><div class="sub">Monthly amount for each provider</div><div class="chart-box"><canvas id="cTrend"></canvas></div></div>`;
  h += `<p class="small muted" style="margin:4px">Spending counts each bill in the month it's due, including bills still to pay.</p>`;
  $('#chartsBody').innerHTML = h;
  if (!window.Chart) return;

  Chart.defaults.font.family = 'Nunito, system-ui, sans-serif'; Chart.defaults.font.weight = 700; Chart.defaults.color = '#6B7591';
  const allCats = [...new Set(bills.map(b => b.category || prov(b.provider).category))];
  if (C.mode !== 'month') {
    const ds = allCats.map(c => ({ label: c, backgroundColor: catColour(c), borderRadius: 4, borderSkipped: false, maxBarThickness: 22,
      data: keys.map(k => bills.filter(b => billMonth(b) === k && (b.category || prov(b.provider).category) === c).reduce((s, b) => s + b.amount, 0)) }));
    C.charts.push(new Chart($('#cMonthly'), { type: 'bar', data: { labels: keys.map(k => MON[+k.slice(5) - 1]), datasets: ds },
      options: { maintainAspectRatio: false, onClick: (e, els) => { if (els.length) { C.mode = 'month'; C.month = keys[els[0].index]; renderCharts(); } },
        scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { callback: v => money0(v) }, grid: { color: '#EEF1F7' } } },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'rectRounded' } },
          tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${money(c.raw)}`, footer: items => 'Total ' + money(items.reduce((s, i) => s + i.raw, 0)) } } } } }));
    const provIds = [...new Set(bills.map(b => b.provider))];
    C.charts.push(new Chart($('#cTrend'), { type: 'line', data: { labels: keys.map(k => MON[+k.slice(5) - 1]),
      datasets: provIds.map(id => ({ label: prov(id).name, borderColor: prov(id).colour, backgroundColor: prov(id).colour, tension: .3, pointRadius: 2.5, borderWidth: 2.5, spanGaps: true,
        data: keys.map(k => { const v = bills.filter(b => b.provider === id && billMonth(b) === k).reduce((s, b) => s + b.amount, 0); return v || null; }) })) },
      options: { maintainAspectRatio: false, scales: { x: { grid: { display: false } }, y: { ticks: { callback: v => money0(v) }, grid: { color: '#EEF1F7' } } },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, boxHeight: 8, usePointStyle: true } }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${money(c.raw)}` } } } } }));
  }
  if (cats.length) C.charts.push(new Chart($('#cCat'), { type: 'doughnut', data: { labels: cats.map(c => c[0]), datasets: [{ data: cats.map(c => c[1]), backgroundColor: cats.map(c => catColour(c[0])), borderWidth: 3, borderColor: '#fff' }] },
    options: { maintainAspectRatio: false, cutout: '62%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.label}: ${money(c.raw)}` } } } } }));
}

function exportCsv() {
  const cols = ['provider', 'category', 'amount', 'dueDate', 'issueDate', 'status', 'paidDate', 'invoiceNo', 'accountNo', 'period', 'autopay'];
  const rows = [['Provider', 'Category', 'Amount', 'Due date', 'Issue date', 'Status', 'Paid date', 'Invoice', 'Account', 'Period', 'Auto-debit']]
    .concat(S.bills.filter(b => b.status !== 'ignored').sort((a, b) => (a.dueDate || '') < (b.dueDate || '') ? -1 : 1)
      .map(b => cols.map(c => c === 'provider' ? prov(b.provider).name : c === 'category' ? (b.category || prov(b.provider).category) : c === 'amount' ? b.amount.toFixed(2) : c === 'autopay' ? (b.autopay ? 'yes' : '') : (b[c] ?? ''))));
  const csv = rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = 'billbell-' + today() + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}

async function run(fn, okMsg) {

async function uploadFile(file) {
  if (S.demo) return toast('Connect your scanner in Settings first');
  if (file.size > 12e6) return toast('That file is too big (max 12 MB)');
  toast('Reading your bill…');
  let mime = file.type || 'application/pdf', data;
  if (/^image\//.test(mime)) {
    const img = await createImageBitmap(file);
    const scale = Math.min(1, 2000 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = img.width * scale; c.height = img.height * scale;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    data = c.toDataURL('image/jpeg', .85).split(',')[1]; mime = 'image/jpeg';
  } else data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
  closeSheet();
  await run(() => api('upload', {data, mime, name: file.name || 'bill.jpg'}), 'Added — check it in Review');
  S.tab = 'review'; render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-prov],[data-bill],[data-act],[data-copy],[data-mode]');
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.mode) { C.mode = t.dataset.mode; renderCharts(); return; }
  if (t.dataset.copy !== undefined) { copy(t.dataset.copy, t.dataset.what); return; }
  if (t.dataset.prov && !t.dataset.act) { openProvider(t.dataset.prov); return; }
  if (t.dataset.bill) { openBill(t.dataset.bill); return; }
  const act = t.dataset.act, card = t.closest('.rcard');
  switch (act) {
    case 'close': closeSheet(); break;
    case 'settings': openSettings(); break;
    case 'paid': closeSheet(); markPaid(t.dataset.id); break;
    case 'unpaid': closeSheet(); run(() => update(t.dataset.id, {status: 'due', paidDate: ''}), 'Moved back to Due'); break;
    case 'ignore': run(() => update(card.dataset.id, {status: 'ignored'}), 'Removed'); break;
    case 'confirm': {
      const g = n => card.querySelector(`[name=${n}]`).value;
      const amount = parseFloat(g('amount').replace(/[$,]/g, ''));
      if (!(amount > 0)) return toast('Enter the amount');
      if (g('provider') === 'unknown') return toast('Choose the provider');
      if (!g('dueDate')) return toast('Enter the due date');
      const st = g('status');
      run(() => update(card.dataset.id, {provider: g('provider'), amount: amount.toFixed(2), dueDate: g('dueDate'), status: st, paidDate: st === 'paid' ? today() : '', reason: ''}), 'Confirmed');
      break;
    }
    case 'addManual': {
      const amount = parseFloat(($('#mAmt').value || '').replace(/[$,]/g, ''));
      if ($('#mProv').value === 'unknown' || !$('#mProv').value) return toast('Choose the provider');
      if (!(amount > 0)) return toast('Enter the amount');
      const st = $('#mStatus').value;
      closeSheet();
      run(() => api('add', {bill: {provider: $('#mProv').value, amount: amount.toFixed(2), dueDate: $('#mDue').value, status: st, paidDate: st === 'paid' ? today() : ''}}), 'Bill added');
      break;
    }
    case 'saveConn': {
      let a = $('#sApi').value.trim(), k = $('#sKey').value.trim();
      if (a.includes('#api=')) { const p = new URLSearchParams(a.split('#')[1]); a = p.get('api'); k = p.get('key'); }
      a = (a || '').trim().split('?')[0];
      if (/googleusercontent\.com/.test(a)) return toast('That\'s a result page address. Copy the Web app URL from Deploy → Manage deployments instead (it ends in /exec).');
      if (!/^https:\/\/script\.google\.com\/.*\/exec$/.test(a)) return toast('The scanner URL should start with https://script.google.com/macros/s/ and end with /exec');
      if (!k) return toast('Paste your app key too (run testApp in Apps Script to see it)');
      ls.set('bb_api', a); ls.set('bb_key', k); closeSheet(); load(true); break;
    }
    case 'disconnect': ls.del('bb_api'); ls.del('bb_key'); ls.del('bb_cache'); closeSheet(); load(); break;
    case 'scan': closeSheet(); toast('Checking your email…'); run(() => api('scan', {}), 'Email checked'); break;
    case 'testNotify': run(() => api('testNotify', {}), 'Test alert sent'); break;
    case 'csv': exportCsv(); break;
    case 'pinOn': closeSheet(); setPin(); break;
    case 'pinOff': ls.del('bb_pin'); ls.del('bb_bio'); closeSheet(); toast('App lock removed'); break;
    case 'bioOn': if (ls.get('bb_pin')) enableBio(); break;
    case 'bioOff': ls.del('bb_bio'); closeSheet(); toast('Face ID turned off'); break;

/* Swipe a bill left to mark it paid */
let sw = null;
document.addEventListener('touchstart', e => {
  const card = e.target.closest('.swipe .bill'); if (!card || e.target.closest('a,button,input,select')) return;
  sw = {card, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, lock: null};
}, {passive: true});
document.addEventListener('touchmove', e => {
  if (!sw) return;
  const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
  if (sw.lock === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) sw.lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  if (sw.lock !== 'x') return;
  sw.dx = Math.min(0, dx); sw.card.classList.add('dragging'); sw.card.style.transform = `translateX(${sw.dx}px)`;
}, {passive: true});
document.addEventListener('touchend', () => {
  if (!sw) return; const {card, dx} = sw; sw = null;
  card.classList.remove('dragging');
  if (dx < -110) {
    card.style.transform = 'translateX(-110%)';
    const id = card.parentElement.dataset.swipe;
    setTimeout(() => { closeSheet(); markPaid(id); }, 220);
  } else card.style.transform = '';
});

/* ================= PIN lock ================= */
async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('billbell:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
const PIN = { entry: '', mode: 'unlock', first: '' };
function drawPin() { document.querySelectorAll('#pinDots i').forEach((d, i) => d.classList.toggle('f', i < PIN.entry.length)); }
$('#pinKeys').innerHTML = [1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}">${k}</button>`).join('');
$('#pinKeys').addEventListener('click', async e => {
  const k = e.target.dataset.k; if (k === undefined) return;
  if (k === '⌫') PIN.entry = PIN.entry.slice(0, -1); else if (PIN.entry.length < 4) PIN.entry += k;
  drawPin();
  if (PIN.entry.length < 4) return;
  const v = PIN.entry; PIN.entry = '';
  if (PIN.mode === 'unlock') {
    if (await sha(v) === ls.get('bb_pin')) { $('#pin').classList.remove('on'); }
    else { $('#pinDots').classList.add('shake'); setTimeout(() => { $('#pinDots').classList.remove('shake'); drawPin(); }, 350); }
  } else if (PIN.mode === 'set1') { PIN.first = v; PIN.mode = 'set2'; $('#pinMsg').textContent = 'Enter it again'; drawPin(); }
  else { if (v === PIN.first) { ls.set('bb_pin', await sha(v)); $('#pin').classList.remove('on'); toast('PIN set'); }
         else { PIN.mode = 'set1'; $('#pinMsg').textContent = 'Didn\'t match — choose a PIN'; drawPin(); } }
});
function lock() {
  if (!ls.get('bb_pin')) return;
  PIN.mode = 'unlock'; PIN.entry = ''; drawPin();
  const bio = !!ls.get('bb_bio');
  $('#bioBtn').hidden = !bio;
  $('#pinMsg').textContent = bio ? 'Use Face ID or enter your PIN' : 'Enter your PIN';
  $('#pin').classList.add('on');
}

/* Face ID (passkey on this phone) */
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function enableBio() {
  try {
    if (!window.PublicKeyCredential || !(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())) return toast('Face ID isn\'t available on this device');
    const cred = await navigator.credentials.create({publicKey: {
      challenge: rand(32), rp: {name: 'BillBell'},
      user: {id: rand(16), name: 'BillBell', displayName: 'BillBell app lock'},
      pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
      authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged'}, timeout: 60000}});
    ls.set('bb_bio', b64(cred.rawId)); closeSheet(); toast('Face ID turned on', {tick: 1});
  } catch (e) { toast(e.name === 'NotAllowedError' ? 'Face ID wasn\'t set up' : 'Face ID isn\'t available here'); }
}
async function unlockBio() {
  try {
    await navigator.credentials.get({publicKey: {challenge: rand(32), allowCredentials: [{type: 'public-key', id: unb64(ls.get('bb_bio'))}], userVerification: 'required', timeout: 60000}});
    $('#pin').classList.remove('on');
  } catch (e) { $('#pinMsg').textContent = 'Face ID didn\'t work — enter your PIN'; }
}
$('#bioBtn').onclick = unlockBio;
function setPin() { PIN.mode = 'set1'; PIN.entry = ''; $('#pinMsg').textContent = 'Choose a 4-digit PIN'; drawPin(); $('#pin').classList.add('on'); }

/* Home-screen icon in the chosen theme's colours (used when you tap Add to Home Screen) */
function themeIcon(t) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d'), k = 180 / 512;
    x.scale(k, k);
    x.fillStyle = t.navy; x.beginPath(); x.roundRect ? x.roundRect(0, 0, 512, 512, 112) : x.rect(0, 0, 512, 512); x.fill();
    x.fillStyle = t.gold; x.fill(new Path2D('M256 104c-13 0-24 11-24 24v10c-56 11-96 60-96 118v62l-30 40c-6 8 0 20 10 20h280c10 0 16-12 10-20l-30-40v-62c0-58-40-107-96-118v-10c0-13-11-24-24-24z'));
    x.fillStyle = t.bill === '#FFFFFF' ? '#E5302B' : t.bill; x.fill(new Path2D('M212 396a44 44 0 0 0 88 0z'));
    x.strokeStyle = t.navy; x.lineWidth = 18; x.lineCap = 'round'; x.stroke(new Path2D('M231 230h50M231 268h50'));
    x.beginPath(); x.arc(352, 150, 40, 0, Math.PI * 2); x.fill(); x.lineWidth = 12; x.stroke();
    const url = c.toDataURL('image/png');
    document.querySelectorAll('link[rel="apple-touch-icon"],link[rel="icon"]').forEach(l => { l.href = url; l.type = 'image/png'; });
  } catch (e) {}
}
